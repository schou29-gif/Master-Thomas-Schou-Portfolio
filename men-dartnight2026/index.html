<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dart Night 2026 – Musikquiz</title>
<style>
  :root{
    --bg:#0f1512; --panel:#18211c; --line:#2b3a31; --ink:#f3efe4; --muted:#9fae9f;
    --red:#d8402f; --green:#2f9e5b; --cream:#efe3c2; --gold:#e8b73a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
  body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  header{padding:18px 20px 10px;display:flex;align-items:center;gap:12px}
  .board{width:38px;height:38px;border-radius:50%;flex:none;
    background:radial-gradient(circle,var(--red) 0 14%,var(--green) 15% 24%,var(--cream) 25% 40%,#111 41% 56%,var(--red) 57% 66%,var(--cream) 67% 82%,#111 83%)}
  header h1{font-size:17px;margin:0;letter-spacing:.02em;line-height:1.15}
  header small{display:block;color:var(--muted);font-weight:500;font-size:13px}
  main{flex:1;width:100%;max-width:520px;margin:0 auto;padding:8px 20px 28px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
  h2{font-size:26px;margin:0 0 4px}
  p.lead{color:var(--muted);margin:0 0 18px;font-size:15px;line-height:1.45}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em}
  input[type=text]{width:100%;font-size:18px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0c120f;color:var(--ink);outline:none}
  input[type=text]:focus{border-color:var(--gold)}
  .teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chip{font-size:16px;padding:14px 10px;border-radius:12px;border:1px solid var(--line);background:#0c120f;color:var(--ink);font-weight:600;cursor:pointer}
  .chip.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
  .decades{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .decades .chip{padding:13px 0;font-size:15px}
  .btn{display:block;width:100%;font-size:18px;font-weight:700;padding:16px;border-radius:14px;border:0;cursor:pointer;margin-top:20px;background:var(--red);color:#fff}
  .btn.secondary{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:10px}.row .btn{margin-top:20px}
  .progress{height:6px;background:#0c120f;border-radius:6px;overflow:hidden;margin:4px 0 18px}
  .progress i{display:block;height:100%;background:var(--gold);transition:width .25s}
  .qnum{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
  .big{font-size:56px;font-weight:800;line-height:1;margin:6px 0 2px}
  .bonusq{font-size:19px;line-height:1.4;margin:8px 0 4px}
  .saved{font-size:13px;color:var(--muted);text-align:center;margin-top:12px;min-height:16px}
  .jump{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:22px}
  .jump button{font-size:12px;padding:7px 0;border-radius:7px;border:1px solid var(--line);background:#0c120f;color:var(--muted);cursor:pointer}
  .jump button.done{color:var(--ink);border-color:#3d5446}
  .jump button.cur{background:var(--gold);color:#1a1405;border-color:var(--gold)}
  .total{font-size:64px;font-weight:800;color:var(--gold);line-height:1;margin:8px 0}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:14px}
  td{padding:9px 4px;border-top:1px solid var(--line);vertical-align:top}
  td.n{color:var(--muted);width:26px}
  .facit{color:var(--muted);font-size:12.5px;margin-top:2px}
  .ans{font-size:14px}
  .pts{white-space:nowrap;text-align:right}
  .tog{display:inline-block;min-width:30px;padding:3px 6px;margin:1px 0 1px 3px;border-radius:7px;font-size:12px;font-weight:700;border:0;cursor:pointer}
  .tog.y{background:var(--green);color:#fff}.tog.n{background:#3a2622;color:#e7a79c}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--red);color:#fff;margin-left:4px;vertical-align:1px}
  .hint{font-size:13px;color:var(--muted);line-height:1.45;margin-top:14px}
  .err{color:#ff8f7f;font-size:14px;margin-top:10px;min-height:18px}
  .teamlist{display:grid;gap:12px}
  .teamchip{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font-size:19px;font-weight:700;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#0c120f;color:var(--ink);cursor:pointer}
  .teamchip.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
  .teamchip .logo{width:56px;height:56px;flex:none}
  .logo svg,.mini svg{display:block;width:100%;height:100%}
  .mini{display:inline-block;width:18px;height:18px;vertical-align:-4px;margin-right:6px}
  .resteam{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;margin-bottom:6px}
  .resteam .logo{width:52px;height:52px;flex:none}
  .bull{text-align:center;padding-top:20px}
  .bullboard{position:relative;width:220px;height:220px;margin:10px auto 18px;border-radius:50%;
    background:radial-gradient(circle,var(--red) 0 9%,var(--green) 10% 18%,var(--cream) 19% 34%,#111 35% 50%,var(--red) 51% 60%,var(--cream) 61% 78%,#111 79% 92%,#2a2a2a 93%);
    animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;box-shadow:0 0 0 0 rgba(232,183,58,.7);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both, glow 1.4s .5s ease-out 2}
  .dart{position:absolute;left:50%;top:50%;width:90px;height:8px;margin-top:-4px;transform-origin:0 50%;transform:rotate(-35deg);
    background:linear-gradient(90deg,#ccc 0 8%,#333 8% 60%,var(--gold) 60%);border-radius:3px;animation:hit .35s .25s ease-in both}
  .dart:after{content:"";position:absolute;right:-6px;top:-8px;border-left:16px solid var(--red);border-top:12px solid transparent;border-bottom:12px solid transparent}
  .bulltxt{font-size:52px;font-weight:900;letter-spacing:.04em;color:var(--gold);animation:pop .5s .45s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes hit{from{transform:rotate(-35deg) translateX(160px);opacity:0}to{transform:rotate(-35deg) translateX(0);opacity:1}}
  @keyframes glow{to{box-shadow:0 0 0 40px rgba(232,183,58,0)}}
  .missboard{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both, wobble .5s .55s ease-in-out both}
  .missdart{left:96%;top:12%;transform:rotate(-35deg);animation:hitmiss .35s .25s ease-in both}
  .misstxt{color:var(--red);font-size:44px}
  @keyframes hitmiss{from{transform:rotate(-35deg) translateX(160px);opacity:0}to{transform:rotate(-35deg) translateX(0);opacity:1}}
  @keyframes wobble{0%,100%{rotate:0deg}25%{rotate:-6deg}50%{rotate:5deg}75%{rotate:-3deg}}
  .closedart{left:63%;top:32%}
  .closetxt{color:var(--cream);font-size:36px;line-height:1.05}
  .zeroboard{opacity:.55;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
  .zerotxt{color:var(--muted);font-size:44px}
  .bullboard{width:180px;height:180px}
  .answer{animation:fadeup .45s 1.1s ease-out both;text-align:left;margin-top:6px}
  .btn.answer{margin-top:16px;text-align:center}
  .ansline{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .ansline:first-of-type{border-top:0}
  .mk{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
  .mk.y{background:var(--green);color:#fff}.mk.n{background:#3a2622;color:#e7a79c}
  .al{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .ar{font-size:18px;font-weight:700}
  .at{font-size:13px;color:var(--muted);margin-top:2px}
  @keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  footer{text-align:center;padding:0 20px 24px}
  footer button{background:none;border:0;color:#5f6f63;font-size:13px;text-decoration:underline;cursor:pointer;padding:8px}
  .rds{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
  .rd{background:#0c120f;border:1px solid var(--line);border-radius:10px;padding:8px 0;text-align:center}
  .rd span{display:block;font-size:12px;color:var(--muted)}.rd b{font-size:22px}
  .brow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .brow .pl{width:26px;font-size:22px;text-align:center}
  .brow .logo{width:44px;height:44px;flex:none}
  .brow .bn{flex:1;min-width:0;font-weight:700;font-size:17px}
  .brow .bp{flex:none;width:76px;font-size:22px;font-weight:800;text-align:right;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#0c120f;color:var(--gold)}

  function norm(x){
    return String(x||"").toLowerCase().replace(/ø/g,"o").replace(/æ/g,"ae").replace(/å/g,"aa").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()
      .replace(/\([^)]*\)|\[[^\]]*\]/g," ")            // tekst i parentes er valgfri

    return x.replace(/ph/g,"f").replace(/ck/g,"k").replace(/c/g,"k").replace(/z/g,"s").replace(/y/g,"i")
      .replace(/w/g,"v").replace(/q/g,"k").replace(/x/g,"ks").replace(/h/g,"").replace(/(.)\1+/g,"$1");
  }
  function lev(a,b){
    var m=a.length,n=b.length; if(!m) return n; if(!n) return m;
    var p=[],c,i,j; for(j=0;j<=n;j++) p[j]=j;
    for(i=1;i<=m;i++){ c=[i]; for(j=1;j<=n;j++){ c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); } p=c; }
    return p[n];
  }

    if(A===B) return true;
    if(/^\d+$/.test(B)) return A.indexOf(B)>=0;          // tal (f.eks. 1979) skal være præcise
    if(B.length>=5 && A.indexOf(B)>=0) return true;      // facit står i svaret
    return near(A,B) || near(loose(A),loose(B));

    var V={
      3:{cls:"",dart:"dart",txt:"BULLSEYE!",tc:"",sub:"Kunstner, titel og årti – alle tre rigtige.",vib:[60,40,120]},
      2:{cls:"closeboard",dart:"dart closedart",txt:"CLOSE BUT NO CIGAR!",tc:"closetxt",sub:"To ud af tre – lige ved siden af plet.",vib:[80,60,80]},
      1:{cls:"missboard",dart:"dart missdart",txt:"WHAT A MISS!",tc:"misstxt",sub:"Kun ét af de tre svar sad i skiven.",vib:250},
      0:{cls:"zeroboard",dart:"",txt:"0 AF 3",tc:"zerotxt",sub:"Ingen af svarene ramte skiven denne gang.",vib:0}
    }[r.hits];
    var okA=matchAny(s.a,f[0]), okT=matchAny(s.t,f[1]), okD=s.d===decadeOf(f[3]);
    function line(lbl,ok,their,right){
      return '<div class="ansline"><span class="mk '+(ok?'y':'n')+'">'+(ok?'✓':'✗')+'</span><div><div class="al">'+lbl+'</div>'+
        '<div class="ar">'+esc(right)+'</div>'+(ok?'':'<div class="at">I svarede: '+(esc(their)||'–')+'</div>')+'</div></div>';
    }
    h('<div class="bull"><div class="bullboard '+V.cls+'">'+(V.dart?'<div class="'+V.dart+'"></div>':'')+'</div>'+
      '<div class="bulltxt '+V.tc+'">'+V.txt+'</div>'+
      '<p class="lead" style="text-align:center">'+V.sub+'</p>'+
      '<div class="card answer"><div class="qnum">Rigtigt svar · nummer '+(i+1)+(f[2]==="s"?' <span class="tag">SVÆR</span>':'')+'</div>'+
        line("Kunstner",okA,s.a,f[0][0])+line("Titel",okT,s.t,f[1][0])+line("Årti",okD,s.d,decadeOf(f[3])+" ("+f[3]+")")+'</div>'+
      '<button class="btn answer" id="cont">Videre</button></div>');
    if(V.vib && navigator.vibrate){ try{ navigator.vibrate(V.vib); }catch(e){} }
    document.getElementById("cont").onclick=function(){ st.rev=null; save(); render(); };
  }

  function viewStep(){
    st.pos=Math.min(Math.max(st.pos||0,0),SEQ.length-1);
    var step=SEQ[st.pos];
    if(step.k==="p") return st.prev ? viewPracticeReveal(step) : viewPractice(step);
    return step.k==="b" ? viewBonus(step) : viewSong(step);
  }

  function viewSong(step){
    var i=step.i, s=st.songs[i];
    var dec=DECADES.map(function(d){ return '<button class="chip'+(s.d===d?' on':'')+'" data-d="'+d+'">'+d.replace("'erne","’")+'</button>'; }).join("");
    h(head(step)+
      '<div class="card"><div class="big">#'+(i+1)+'</div><p class="lead">Lyt til nummeret, og skriv jeres bud. Tryk "Næste", når I er klar – så er svaret låst.</p>'+
      '<label for="a">Kunstner</label><input type="text" id="a" autocomplete="off" autocapitalize="words" value="'+esc(s.a)+'">'+
      '<label for="t">Sangtitel</label><input type="text" id="t" autocomplete="off" value="'+esc(s.t)+'">'+
      '<label>Årti</label><div class="decades">'+dec+'</div>'+
      '<button class="btn" id="next">Næste</button>'+
      '<div class="saved" id="sv"></div></div>');
    var a=document.getElementById("a"), t=document.getElementById("t"), sv=document.getElementById("sv");
    function mark(){ sv.textContent="Gemt"; clearTimeout(mark.t); mark.t=setTimeout(function(){sv.textContent="";},1200); }
    a.oninput=function(){ s.a=a.value; save(); mark(); };
    t.oninput=function(){ s.t=t.value; save(); mark(); };
    app.querySelectorAll("[data-d]").forEach(function(b){ b.onclick=function(){ var d=b.getAttribute("data-d"); s.d=(s.d===d?"":d); save();
      app.querySelectorAll("[data-d]").forEach(function(x){ x.classList.toggle("on", x.getAttribute("data-d")===s.d); }); mark(); }; });
    nextBtn(function(){ return !s.a.trim() && !s.t.trim() && !s.d; }, function(){
      var f=songOf(i).f;
      return (matchAny(s.a,f[0])?1:0) + (matchAny(s.t,f[1])?1:0) + (s.d===decadeOf(f[3])?1:0);
    });
  }

  function viewPractice(step){
    var k=step.i, P=PRACTICE[k];
    if(!Array.isArray(st.practice)) st.practice=["",""];
    h(head(step)+
      '<div class="card"><div class="big">Prøve '+(k+1)+'</div><p class="lead">Et prøvespørgsmål, så I kan se, hvordan det virker. Det tæller ikke med i pointene.</p>'+
      '<p class="bonusq">'+esc(P.q)+'</p>'+
      '<label for="x">Jeres svar</label><input type="text" id="x" autocomplete="off" value="'+esc(st.practice[k]||"")+'">'+
      '<button class="btn" id="next">Næste</button><div class="saved" id="sv"></div></div>');
    var x=document.getElementById("x");
    x.oninput=function(){ st.practice[k]=x.value; save(); document.getElementById("sv").textContent="Gemt"; };
    document.getElementById("next").onclick=function(){ st.prev=true; save(); render(); };
  }
  function viewPracticeReveal(step){
    var k=step.i, P=PRACTICE[k], their=(st.practice||[])[k]||"", ok=matchAny(their,[P.a]), last=k===PRACTICE.length-1;
    h('<div class="bull"><div class="bullboard'+(ok?'':' missboard')+'"><div class="dart'+(ok?'':' missdart')+'"></div></div>'+
      '<div class="bulltxt'+(ok?'':' misstxt')+'">'+(ok?'BULLSEYE!':'WHAT A MISS!')+'</div>'+
      '<div class="card answer"><div class="qnum">Rigtigt svar · prøvespørgsmål '+(k+1)+' (tæller ikke)</div>'+
      '<div class="ansline"><span class="mk '+(ok?'y':'n')+'">'+(ok?'✓':'✗')+'</span><div><div class="ar">'+esc(P.a)+'</div>'+
      (ok?'':'<div class="at">I svarede: '+(esc(their)||'–')+'</div>')+'</div></div></div>'+
      (last?'<p class="lead" style="text-align:center;margin-top:14px">Sådan ser det ud efter hvert nummer: 3 rigtige giver BULLSEYE, 2 giver CLOSE BUT NO CIGAR, og 1 giver WHAT A MISS.</p>':'')+
      '<button class="btn answer" id="cont">'+(last?'Videre til nummer 1':'Videre til prøvespørgsmål 2')+'</button></div>');
    document.getElementById("cont").onclick=function(){ st.prev=false; st.pos++; save(); render(); };
  }
  function viewBonus(step){
    var b=step.i;
    h(head(step)+
      '<div class="card"><div class="qnum" style="color:var(--gold)">Bonus · 2 point</div><p class="bonusq">'+esc(BONUS_Q[b])+'</p>'+
      '<label for="x">Jeres svar</label><input type="text" id="x" autocomplete="off" value="'+esc(st.bonus[b])+'">'+
      '<button class="btn" id="next">Næste</button>'+
      '<div class="saved" id="sv"></div></div>');
    var x=document.getElementById("x"), sv=document.getElementById("sv");
    x.oninput=function(){ st.bonus[b]=x.value; save(); sv.textContent="Gemt"; };
    nextBtn(function(){ return !st.bonus[b].trim(); });
  }

  function viewReview(){
    var missing=0, rows="";
    st.songs.forEach(function(s,i){ if(!s.a&&!s.t) missing++;
      rows+='<tr><td class="n">'+(i+1)+'</td><td class="ans">'+(esc(s.a)||'<span class="facit">–</span>')+' · '+(esc(s.t)||'<span class="facit">–</span>')+' <span class="facit">'+esc(s.d||"")+'</span></td></tr>'; });
    st.bonus.forEach(function(v,i){ rows+='<tr><td class="n">B'+(i+1)+'</td><td class="ans">'+(esc(v)||'<span class="facit">–</span>')+'</td></tr>'; });
    h('<div class="card"><h2>Klar til at aflevere?</h2>'+
      '<p class="lead">'+(missing?missing+' numre står uden svar. ':'Alle numre har et svar. ')+'Aflever, så quizmasteren kan rette.</p>'+
      '<button class="btn" id="sub">Aflever svar</button>'+
      '<table>'+rows+'</table></div>');
    document.getElementById("sub").onclick=function(){ if(!confirmSubmit()) return; st.submitted=true; save(); render(); };
  }
  function confirmSubmit(){
    var b=document.getElementById("sub");
    if(b.getAttribute("data-sure")) return true;
    b.setAttribute("data-sure","1"); b.textContent="Tryk igen for at aflevere"; return false;
  }

  function viewDone(){
    h('<div class="card"><h2>Afleveret!</h2>'+
      (teamObj(st.team)?'<div class="resteam"><span class="logo">'+teamObj(st.team).logo+'</span><span>'+esc(st.team)+'</span></div>':'')+'<p class="lead">'+esc(st.team)+'s svar er låst. Giv telefonen til quizmasteren, når der skal rettes.</p>'+
      '<label for="c">Quizmasterens kode</label><input type="text" id="c" inputmode="numeric" autocomplete="off" autocapitalize="off">'+
      '<div class="err" id="er"></div><button class="btn" id="go">Ret svarene</button></div>');
    var c=document.getElementById("c");
    document.getElementById("go").onclick=function(){
      if(c.value.trim().toLowerCase()===QM_CODE){ st.unlocked=true; save(); render(); }
      else document.getElementById("er").textContent="Forkert kode.";
    };
  }

  function tog(kind,i,field,val,label){
    return '<button class="tog '+(val?'y':'n')+'" data-o="'+kind+i+field+'" data-v="'+(val?1:0)+'">'+label+(val?' ✓':' ✗')+'</button>';
  }
  function viewResult(){
    var sc=score(), rows="";
    FACIT.songs.forEach(function(f,i){ var s=st.songs[i], r=sc.rows[i];
      rows+='<tr><td class="n">'+(i+1)+'</td><td><div class="ans">'+(esc(s.a)||'–')+' · '+(esc(s.t)||'–')+' · '+(esc(s.d)||'–')+'</div>'+
        '<div class="facit">'+esc(f[0][0])+' · '+esc(f[1][0])+' · '+f[3]+(f[2]==="s"?'<span class="tag">SVÆR</span>':'')+'</div></td>'+
        '<td class="pts">'+tog("s",i,"a",r.a,"K")+tog("s",i,"t",r.t,"T")+tog("s",i,"d",r.d,"Å")+'<div class="facit">'+r.p+' p</div></td></tr>'; });
    FACIT.bonus.forEach(function(f,i){ var v=sc.brows[i];
      rows+='<tr><td class="n">B'+(i+1)+'</td><td><div class="ans">'+(esc(st.bonus[i])||'–')+'</div><div class="facit">'+esc(f[0])+'</div></td>'+
        '<td class="pts">'+tog("b",i,"x",v,"")+'<div class="facit">'+(v?2:0)+' p</div></td></tr>'; });
    h('<div class="card"><div class="resteam">'+(teamObj(st.team)?'<span class="logo">'+teamObj(st.team).logo+'</span>':'')+'<span>'+esc(st.team)+'</span></div><div class="total">'+sc.total+' point</div>'+
      '<p class="lead">Siden har rettet automatisk. Tryk på et felt for at ændre rigtigt/forkert, hvis stavningen var tæt nok på.</p>'+
      '<table>'+rows+'</table>'+
      '<p class="hint">K = kunstner, T = titel (1 point hver, 2 ved svære numre) · Å = årti (1 point) · Bonus = 2 point.</p>'+
      '<button class="btn secondary" id="reset">Nulstil telefonen til et nyt hold</button></div>');
    app.querySelectorAll("[data-o]").forEach(function(b){ b.onclick=function(){ var k=b.getAttribute("data-o"); st.over[k]=b.getAttribute("data-v")!=="1"; save(); var y=window.scrollY; viewResult(); window.scrollTo(0,y); }; });
    var r=document.getElementById("reset");
    r.onclick=function(){ if(!r.getAttribute("data-sure")){ r.setAttribute("data-sure","1"); r.textContent="Tryk igen – alle svar slettes"; return; }
      st=fresh(); save(); render(); };
  }

  var BKEY="dartnight2026-tavle", board=null;
  function loadBoard(){ try{ var x=localStorage.getItem(BKEY); if(x) return JSON.parse(x); }catch(e){} return board||{}; }
  function saveBoard(b){ board=b; try{ localStorage.setItem(BKEY,JSON.stringify(b)); }catch(e){} }
  function viewQM(){
    h('<div class="card"><h2>Quizmaster</h2>'+
      '<label for="c">Kode</label><input type="text" id="c" inputmode="numeric" autocomplete="off" autocapitalize="off">'+
      '<div class="err" id="er"></div>'+
      '<button class="btn" id="tav">Samlet stilling</button>'+
      '<button class="btn secondary" id="rs">Start forfra på denne telefon</button>'+
      '<button class="btn secondary" id="no">Tilbage</button></div>');
    function okc(){ if(document.getElementById("c").value.trim().toLowerCase()===QM_CODE) return true; document.getElementById("er").textContent="Forkert kode."; return false; }
    document.getElementById("no").onclick=render;
    document.getElementById("tav").onclick=function(){ if(okc()) viewBoard(); };
    document.getElementById("rs").onclick=function(){ if(okc()) viewReset(); };
  }
  function viewBoard(){
    var b=loadBoard();
    var rows=TEAMS.map(function(t){ return {t:t,p:+(b[t.name]||0)}; }).sort(function(x,y){ return y.p-x.p; });
    var medals=["🥇","🥈","🥉"], list="";
    rows.forEach(function(r,i){ var same=i>0&&r.p===rows[i-1].p;
      list+='<div class="brow"><span class="pl">'+(r.p>0?medals[i]:"")+'</span><span class="logo">'+r.t.logo+'</span><span class="bn">'+esc(r.t.name)+'<small class="mem">'+esc(r.t.members)+'</small></span>'+
        '<input class="bp" inputmode="numeric" pattern="[0-9]*" data-b="'+esc(r.t.name)+'" value="'+(b[r.t.name]||"")+'" placeholder="0"></div>'; });
    h('<div class="card"><div class="qnum">Dart Night 2026</div><h2>Samlet stilling</h2>'+
      '<p class="lead">Skriv holdenes point fra deres telefoner. Listen sorterer sig selv.</p>'+list+
      '<button class="btn" id="upd">Opdater stilling</button><button class="btn secondary" id="no">Tilbage til quizzen</button></div>');
    document.getElementById("upd").onclick=function(){ var nb={}; app.querySelectorAll("[data-b]").forEach(function(i){ var v=parseInt(i.value,10); if(!isNaN(v)) nb[i.getAttribute("data-b")]=v; }); saveBoard(nb); viewBoard(); };
    document.getElementById("no").onclick=render;
  }
  function viewReset(){
    h('<div class="card"><h2>Start forfra?</h2>'+
      '<p class="lead">Alle svar på denne telefon slettes, og quizzen starter forfra med valg af hold.</p>'+
      '<div class="row"><button class="btn secondary" id="no">Annuller</button><button class="btn" id="yes">Start forfra</button></div></div>');
    document.getElementById("no").onclick=render;
    document.getElementById("yes").onclick=function(){ st=fresh(); save(); render(); };
  }
  document.getElementById("qmreset").onclick=viewQM;
  render();
})();
</script>
</body>
</html>
